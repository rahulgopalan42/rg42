ference\"},\"imageContent\":{\"altText\":null,\"description\":null,\"tags\":null,\"title\":null},\"imageSize\":null,\"isImageDecorative\":null},\"internalLink\":null,\"isExternalPage\":null,\"lname\":null,\"name\":\"Lennart Blecher\",\"role\":\"Chairperson of EQT Real Assets\",\"workdayImage\":\"https://storage.googleapis.com/eqt-public-web-workday-image-bucket-prod/employee-images/lennart-blecher-1068.png\",\"workdayImageOverride\":null},\"heroImage\":{\"_type\":\"image\",\"asset\":{\"_ref\":\"image-cae4b4aade97cbf83632008b7bf90ab6cb544e41-1080x1080-jpg\",\"_type\":\"reference\"}},\"isAuthorBioVisible\":true,\"isAuthorVisible\":true,\"language\":\"en\",\"parentData\":{\"breadcrumbTitle\":\"Infrastructure\",\"language\":\"en\",\"parent\":{\"breadcrumbTitle\":\"ThinQ\",\"language\":\"en\",\"parent\":null,\"slug\":{\"_type\":\"slug\",\"current\":\"thinq\"},\"title\":\"ThinQ\"},\"slug\":{\"_type\":\"slug\",\"current\":\"infrastructure\"},\"title\":\"Infrastructure\"},\"previewImage\":{\"altImageText\":null,\"asset\":{\"_ref\":\"image-e39a3f82ba1b1a447ea32bd0180eaea051249ae4-1920x1080-jpg\",\"_type\":\"reference\"},\"imageContent\":{\"altText\":null,\"description\":null,\"tags\":null,\"title\":null},\"imageSize\":null,\"isImageDecorative\":null},\"previewImageMobile\":{\"altImageText\":null,\"asset\":{\"_ref\":\"image-cae4b4aade97cbf83632008b7bf90ab6cb544e41-1080x1080-jpg\",\"_type\":\"reference\"},\"imageContent\":{\"altText\":null,\"description\":null,\"tags\":null,\"title\":null},\"imageSize\":null,\"isImageDecorative\":null},\"previewSubtitle\":\"Lennard Blecher shares the story of how EQT defied the odds to launch its successful infrastructure strategy, proving the power of determination and forward-thinking in private equity.\",\"previewTitle\":\"“Doing as We're Told Could've Cost EQT €50B”\",\"publishedDate\":\"2024-06-05T11:26:06Z\",\"slug\":{\"_type\":\"slug\",\"current\":\"how-we-launched-eqt-infrastructure-despite-being-told-not-to\"},\"title\":\"How we Launc
